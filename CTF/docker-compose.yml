# Start the CTF:      docker compose up -d --build
# Log in:             docker exec -it t1087-ctf bash
# Tear it all down:   docker compose down --rmi local

services:
  acme-db02:
    build: .
    pull_policy: build            # always build from the Dockerfile; never try Docker Hub
    image: t1087-ctf
    container_name: t1087-ctf
    hostname: acme-db02           # gives the prompt: student@acme-db02:~$
    init: true

    # --- Safety settings: this lab never needs any of these ---
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
